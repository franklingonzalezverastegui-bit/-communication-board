<!doctype html>

<html lang="es">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Tablero de Comunicación</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#f4f8ff;

  color:#10264d;

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

}

header{

  background:white;

  padding:calc(14px + env(safe-area-inset-top)) 10px 12px;

  position:sticky;

  top:0;

  z-index:2;

  border-bottom:1px solid #d7e3f3;

}

h1{font-size:22px;text-align:center;margin:0}

.sub{text-align:center;font-size:13px;margin-top:3px}

.grid{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:8px;

  padding:10px 9px 95px;

}

.card{

  text-decoration:none;

  color:#10264d;

  min-height:116px;

  border:2px solid #7fc2ef;

  border-radius:17px;

  background:#eaf7ff;

  padding:7px 3px;

  text-align:center;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

}

.card:nth-child(5n+1){background:#fff9dc;border-color:#edc23f}

.card:nth-child(5n+2){background:#e9f8ff;border-color:#52bce7}

.card:nth-child(5n+3){background:#fff0f5;border-color:#ef80aa}

.card:nth-child(5n+4){background:#effced;border-color:#63c977}

.card:nth-child(5n){background:#f3efff;border-color:#a18ae4}

.ico{font-size:39px}

.es{font-weight:850;font-size:14px;line-height:1.05;margin-top:4px}

.en{font-size:11px;margin-top:3px}

footer{

  position:fixed;

  bottom:0;

  width:100%;

  background:white;

  border-top:1px solid #d7e3f3;

  text-align:center;

  font-size:11px;

  padding:8px 6px calc(8px + env(safe-area-inset-bottom));

}

.full{

  display:none;

  position:fixed;

  inset:0;

  z-index:20;

  background:white;

  text-align:center;

  padding:calc(70px + env(safe-area-inset-top)) 22px 30px;

  overflow:auto;

}

.full:target{display:block}

.bigico{font-size:120px}

.bigs{font-size:40px;font-weight:900;line-height:1.05}

.bige{font-size:26px;margin-top:8px}

.close{

  text-decoration:none;

  position:absolute;

  right:18px;

  top:calc(18px + env(safe-area-inset-top));

  width:50px;

  height:50px;

  border-radius:50%;

  background:#edf3fb;

  color:#10264d;

  font-size:34px;

  line-height:48px;

}

.audio{

  display:flex;

  justify-content:center;

  gap:10px;

  margin-top:28px;

  flex-wrap:wrap;

}

.audio button{

  border:0;

  border-radius:16px;

  padding:15px 18px;

  font-size:17px;

  font-weight:850;

  background:#e7f2ff;

  color:#075ebd;

}

.hint{

  font-size:12px;

  color:#64748b;

  margin-top:14px;

}

</style>

</head>

<body>

<header>

<h1>💗 Tablero de Comunicación</h1>

<div class="sub">Communication Board</div>

</header>

<main class="grid" id="grid"></main>

<footer>

💗 <b>Donación de la Familia González Stolk</b><br>

Donated with love by the González Stolk Family

</footer>

<div id="screens"></div>

<script>

const cards = [

["🍽️","Hambre","Hungry","Tengo hambre.","I'm hungry."],

["💧","Sed","Thirsty","Tengo sed.","I'm thirsty."],

["❄️","Frío","Cold","Tengo frío.","I'm cold."],

["☀️","Calor","Hot","Tengo calor.","I'm hot."],

["🤢","Náuseas","Nauseated","Tengo náuseas.","I'm nauseated."],

["🤮","Vómito","Vomiting","Estoy vomitando.","I'm vomiting."],

["🫁","Falta de aliento","Short of breath","Me falta el aliento.","I'm short of breath."],

["😷","Tos","Coughing","Tengo tos.","I'm coughing."],

["😣","Dolor","In pain","Tengo dolor.","I'm in pain."],

["🛏️","Descansando","Resting","Estoy descansando.","I'm resting."],

["🙂","Cómodo","Comfortable","Estoy cómodo.","I'm comfortable."],

["☹️","Incómodo","Uncomfortable","Estoy incómodo.","I'm uncomfortable."],

["🌸","Alergias","Allergic","Tengo alergias.","I have allergies."],

["🖐️","Picazón","Itchy","Tengo picazón.","I'm itchy."],

["😵‍💫","Mareos","Dizzy","Estoy mareado.","I'm dizzy."],

["🩸","Sangrado","Bleeding","Estoy sangrando.","I'm bleeding."],

["✅","Listo","Ready","Estoy listo.","I'm ready."],

["❌","No estoy listo","Not ready","No estoy listo.","I'm not ready."],

["😨","Asustado","Scared","Estoy asustado.","I'm scared."],

["❓","Confundido","Confused","Estoy confundido.","I'm confused."],

["😴","Cansado","Tired","Estoy cansado.","I'm tired."],

["😠","Enojado","Angry","Estoy enojado.","I'm angry."],

["😢","Triste","Sad","Estoy triste.","I'm sad."],

["🫂","Sintiéndome solo","Lonely","Me siento solo.","I feel lonely."],

["🍲","Comida / comer","Food / Eat","Quiero comer.","I want to eat."],

["🥤","Beber","Drink","Quiero beber.","I want a drink."],

["💊","Medicina","Medicine","Quiero mi medicina.","I want my medicine."],

["👓","Anteojos","Glasses","Quiero mis anteojos.","I want my glasses."],

["🧼","Lavarme las manos","Wash hands","Quiero lavarme las manos.","I want to wash my hands."],

["🚽","Usar el baño","Bathroom","Quiero usar el baño.","I want to use the bathroom."],

["👕","Cambiarme de ropa","Change clothes","Quiero cambiarme de ropa.","I want to change clothes."],

["🛏️","Sábanas limpias","Sheets changed","Quiero sábanas limpias.","I want my sheets changed."],

["🚿","Ducha","Shower","Quiero una ducha.","I want a shower."],

["🛁","Bañarme en la tina","Bath","Quiero bañarme en la tina.","I want a bath."],

["🪥","Cepillarme los dientes","Brush teeth","Quiero cepillarme los dientes.","I want to brush my teeth."],

["🧴","El succionador","Suctioning","Necesito el succionador.","I need suctioning."],

["🔄","Cambiar posiciones","Change positions","Quiero cambiar de posición.","I want to change positions."],

["🛏️","Levantarme de la cama","Get out of bed","Quiero levantarme de la cama.","I want to get out of bed."],

["🪑","Sentarme en la silla","Sit in chair","Quiero sentarme en la silla.","I want to sit in the chair."],

["🚶","Caminar","Walk","Quiero caminar.","I want to walk."],

["👪","Familia / Pariente","Family / Relative","Quiero ver a mi familia.","I want to see my family."],

["🗣️","Intérprete","Interpreter","Necesito un intérprete.","I need an interpreter."],

["👩‍⚕️","Enfermera","Nurse","Necesito a la enfermera.","I need the nurse."],

["🧑‍⚕️","Doctor","Doctor","Necesito al doctor.","I need the doctor."],

["🙏","Capellán","Chaplain","Quiero hablar con el capellán.","I want to speak with the chaplain."],

["💤","Dormir","Sleep","Quiero dormir.","I want to sleep."],

["💡","Luces encendidas / apagadas","Lights on / off","Quiero cambiar las luces.","I want the lights changed."],

["🧻","Pañuelos de papel","Tissues","Quiero pañuelos de papel.","I want tissues."],

["🧣","Cobija","Blanket","Quiero una cobija.","I want a blanket."],

["🛌","Almohada","Pillow","Quiero una almohada.","I want a pillow."],

["📱","Teléfono / cargador","Cell phone / charger","Quiero mi teléfono o cargador.","I want my phone or charger."],

["📺","Televisión","Television","Quiero la televisión.","I want the television."],

["🟢","0 — Sin dolor","0 — No pain","No tengo dolor.","I have no pain."],

["🟡","2 — Leve","2 — Mild","Mi dolor es leve, nivel dos.","My pain is mild, level two."],

["🟠","4 — Moderado","4 — Moderate","Mi dolor es moderado, nivel cuatro.","My pain is moderate, level four."],

["🟠","6 — Fuerte","6 — Strong","Mi dolor es fuerte, nivel seis.","My pain is strong, level six."],

["🔴","8 — Muy fuerte","8 — Very strong","Mi dolor es muy fuerte, nivel ocho.","My pain is very strong, level eight."],

["🔴","10 — El peor dolor","10 — Worst pain","Mi dolor es nivel diez, el peor dolor.","My pain is level ten, the worst pain."]

];

const grid = document.getElementById("grid");

const screens = document.getElementById("screens");

cards.forEach((c,i)=>{

  const card = document.createElement("a");

  card.className = "card";

  card.href = "#c" + i;

  const ico = document.createElement("div");

  ico.className = "ico";

  ico.textContent = c[0];

  const es = document.createElement("div");

  es.className = "es";

  es.textContent = c[1];

  const en = document.createElement("div");

  en.className = "en";

  en.textContent = c[2];

  card.appendChild(ico);

  card.appendChild(es);

  card.appendChild(en);

  grid.appendChild(card);

  const section = document.createElement("section");

  section.className = "full";

  section.id = "c" + i;

  const close = document.createElement("a");

  close.className = "close";

  close.href = "#";

  close.textContent = "×";

  const bigico = document.createElement("div");

  bigico.className = "bigico";

  bigico.textContent = c[0];

  const bigs = document.createElement("div");

  bigs.className = "bigs";

  bigs.textContent = c[1];

  const bige = document.createElement("div");

  bige.className = "bige";

  bige.textContent = c[2];

  const audio = document.createElement("div");

  audio.className = "audio";

  const btnES = document.createElement("button");

  btnES.textContent = "🔊 Español";

  btnES.addEventListener("click", function(){

    speak(c[3],"es-US");

  });

  const btnEN = document.createElement("button");

  btnEN.textContent = "🔊 English";

  btnEN.addEventListener("click", function(){

    speak(c[4],"en-US");

  });

  audio.appendChild(btnES);

  audio.appendChild(btnEN);

  const hint = document.createElement("div");

  hint.className = "hint";

  hint.textContent = "Toca un botón para escuchar la frase.";

  section.appendChild(close);

  section.appendChild(bigico);

  section.appendChild(bigs);

  section.appendChild(bige);

  section.appendChild(audio);

  section.appendChild(hint);

  screens.appendChild(section);

});

function speak(text,lang){

  if(!("speechSynthesis" in window)){

    alert("Este dispositivo no permite reproducir la voz.");

    return;

  }

  window.speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(text);

  u.lang = lang;

  u.rate = 0.82;

  u.pitch = 1;

  const voices = window.speechSynthesis.getVoices();

  if(lang === "en-US"){

    u.voice =

      voices.find(v => v.lang === "en-US" && /Samantha/i.test(v.name)) ||

      voices.find(v => v.lang === "en-US") ||

      voices.find(v => v.lang && v.lang.startsWith("en")) ||

      null;

  }else{

    u.voice =

      voices.find(v => v.lang === "es-US") ||

      voices.find(v => v.lang && v.lang.startsWith("es")) ||

      null;

  }

  window.speechSynthesis.speak(u);

}

window.speechSynthesis.getVoices();

</script>

</body>

</html>
